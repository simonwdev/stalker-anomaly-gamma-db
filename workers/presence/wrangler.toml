name = "stalker-gamma-presence"
main = "src/index.js"
compatibility_date = "2025-04-01"

# Workers Logs (free plan: 200k events/day). Unsampled so rare cold-start logs
# aren't dropped; lower head_sampling_rate if daily volume nears the cap.
[observability.logs]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceDO"]
